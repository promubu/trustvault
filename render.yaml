# Render Blueprint Specification for TrustVault
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trustvault-backend
    runtime: python
    rootDir: backend
    # NOTE: Render Persistent Disks require a paid plan (Starter tier or higher).
    # If deploying strictly on Render's free tier, set `plan: free`, remove the `disk`
    # block below, and change UPLOAD_DIR to `./uploads` (uploads will be ephemeral).
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: trustvault-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        # Update with your exact Vercel deployment URL (comma-separated if multiple).
        # Wildcard "*" is strictly rejected in production mode (ENVIRONMENT=production).
        value: http://localhost:5173,https://trustvault-frontend.vercel.app
      - key: ENVIRONMENT
        value: production

databases:
  - name: trustvault-db
    # IMPORTANT: Render's free PostgreSQL tier automatically expires 30 days after creation.
    # After 30 days, Render deletes free databases unless upgraded to a paid plan ($7/mo).
    # For non-expiring production storage, upgrade to Starter or use an external provider (Neon/Supabase).
    plan: free
    databaseName: trustvault
    user: trustvault
