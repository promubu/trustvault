services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - trustvault_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  trustvault_db:
